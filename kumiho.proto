syntax = "proto3";

package kumiho;

// A Kumiho Reference (Kref) uniquely identifies any object in the system.
message Kref {
    string uri = 1;
}

// An Edge represents a directed, typed relationship between two revisions.
message Edge {
    Kref source_kref = 1;
    Kref target_kref = 2;
    string edge_type = 3;
    map<string, string> metadata = 4;
    string created_at = 5;
    string author = 6;
    string username = 7;
}

// --- Generic Messages ---

message StatusResponse {
    bool success = 1;
    string message = 2;
}

// Pagination parameters for list requests
message PaginationRequest {
    // Maximum number of items to return (default: 100, max: 1000)
    int32 page_size = 1;
    // Cursor for the next page (opaque string from previous response)
    string cursor = 2;
}

// Pagination info in list responses
message PaginationResponse {
    // Cursor for the next page, empty if no more results
    string next_cursor = 1;
    // Whether there are more results available
    bool has_more = 2;
    // Total count of items (if available, -1 if unknown)
    int32 total_count = 3;
}

message KrefRequest {
    Kref kref = 1;
}

message ResolveKrefRequest {
  string kref = 1;
  optional string tag = 2;
  optional string time = 3; // Time in YYYYMMDDHHMM format
}

message ResolveLocationRequest {
    string kref = 1;
    optional string tag = 2;
    optional string time = 3;
}

message ResolveLocationResponse {
    string location = 1;
    Kref resolved_kref = 2;
    string artifact_name = 3;
}

// --- Space Messages ---

message CreateSpaceRequest {
    string parent_path = 1;
    string space_name = 2;
    bool exists_error = 3;
    map<string, string> metadata = 4;
}

message SpaceResponse {
    string path = 1;
    string created_at = 2;
    string modified_at = 3;
    string author = 4;
    map<string, string> metadata = 5;
    string username = 6;
    string name = 7;
    string type = 8; // "root" or "sub"
}

message GetSpaceRequest {
    string path_or_kref = 1;
}

message DeleteSpaceRequest {
    string path = 1;
    bool force = 2; // If true, allows admin to delete a space with items.
}

message GetChildSpacesRequest {
    string parent_path = 1; // Empty string for root level spaces
    bool recursive = 2;
    // Optional pagination parameters
    optional PaginationRequest pagination = 3;
}

message GetChildSpacesResponse {
    repeated SpaceResponse spaces = 1;
    // Pagination info for the response
    optional PaginationResponse pagination = 2;
}

// --- Item Messages ---

message CreateItemRequest {
    string parent_path = 1;
    string item_name = 2;
    string kind = 3;
    bool exists_error = 4;
}

message GetItemRequest {
    string parent_path = 1;
    string item_name = 2;
    string kind = 3;
}

message ItemResponse {
    Kref kref = 1;
    string name = 2;
    string item_name = 3;
    string kind = 4;
    string created_at = 5;
    string modified_at = 6;
    string author = 7;
    map<string, string> metadata = 8;
    bool deprecated = 9;
    string username = 10;
}

message DeleteItemRequest {
    Kref kref = 1;
    bool force = 2;
}

message GetItemsRequest {
    string parent_path = 1;
    string item_name_filter = 2;
    string kind_filter = 3;
    // Optional pagination parameters
    optional PaginationRequest pagination = 4;
    bool include_deprecated = 5;
}

message GetItemsResponse {
    repeated ItemResponse items = 1;
    // Pagination info for the response
    optional PaginationResponse pagination = 2;
}

message ItemSearchRequest {
    string context_filter = 1;
    string item_name_filter = 2;
    string kind_filter = 3;
    // Optional pagination parameters
    optional PaginationRequest pagination = 4;
    bool include_deprecated = 5;
}

// --- Full-Text Search Messages ---
// Provides Google-like fuzzy search across items, revisions, and artifacts

message SearchRequest {
    // Search query string (supports Lucene syntax for advanced users)
    // Simple usage: "hero model" finds items matching both terms
    // Fuzzy matching is automatic - typos like "heros" will match "hero"
    string query = 1;

    // Optional: Restrict search to a kref prefix (e.g., "myproject/assets")
    string context_filter = 2;

    // Optional: Filter by exact item kind (e.g., "model", "texture", "rig")
    string kind_filter = 3;

    // Include soft-deleted (deprecated) items in results
    bool include_deprecated = 4;

    // Pagination parameters
    optional PaginationRequest pagination = 5;

    // Minimum relevance score (0.0 to 1.0, default 0.0 returns all matches)
    float min_score = 6;

    // Search depth options - control performance vs completeness tradeoff
    // Default: Only search Item index (fastest)
    // When enabled, also searches Revision/Artifact metadata (slower but more comprehensive)
    bool include_revision_metadata = 7;
    bool include_artifact_metadata = 8;
}

message SearchResult {
    // The matched item (search always returns Items, even when matching on revision/artifact metadata)
    ItemResponse item = 1;

    // Relevance score from Lucene (higher = better match)
    float score = 2;

    // Where the match was found: "item", "revision", "artifact"
    // Multiple values if matched in multiple places
    repeated string matched_in = 3;
}

message SearchResponse {
    // Search results ordered by relevance score (highest first)
    repeated SearchResult results = 1;

    // Pagination info
    optional PaginationResponse pagination = 2;

    // Search mode used: "fulltext" (Lucene only) or "hybrid" (fulltext + vector)
    // Hybrid mode is available for STUDIO+ tiers with vector embeddings enabled
    optional string search_mode = 3;
}

// --- Revision Scoring Messages ---
// Score specific revisions against a query using server-side embeddings + fulltext

message ScoreRevisionsRequest {
    // Query to score revisions against
    string query = 1;
    // Revisions to score (max 100)
    repeated Kref revision_krefs = 2;
    // When non-empty, re-embed revisions from ONLY these metadata fields
    // instead of using the stored (broad) embedding.  Enables focused
    // scoring — e.g. ["title", "summary"] strips implications/events
    // so the most directly relevant revision ranks highest.
    // When empty (default), uses stored embeddings (current behavior).
    repeated string score_fields = 3;
}

message ScoredRevision {
    // The revision kref
    Kref kref = 1;
    // Relevance score (0.0 - 1.0)
    float score = 2;
    // How the score was computed: "vector", "fulltext", or "hybrid"
    string score_method = 3;
}

message ScoreRevisionsResponse {
    // Scored revisions ordered by score DESC
    repeated ScoredRevision scored_revisions = 1;
    // Overall search mode used: "vector", "fulltext", "hybrid", or "none"
    string search_mode = 2;
}

// --- Revision Messages ---

message CreateRevisionRequest {
    Kref item_kref = 1;
    map<string, string> metadata = 2;
    int32 number = 3; // 0 for next available, >0 for specific revision
    bool exists_error = 4;
    string embedding_text = 5; // Optional: override auto-generated embedding text
}

message RevisionResponse {
    Kref kref = 1;
    Kref item_kref = 2;
    int32 number = 3;
    repeated string tags = 4;
    map<string, string> metadata = 5;
    string created_at = 6;
    string modified_at = 7;
    string author = 8;
    bool deprecated = 9;
    bool published = 10;
    bool latest = 11;
    string username = 12;
    optional string default_artifact = 13;
    string name = 14;
}

message DeleteRevisionRequest {
    Kref kref = 1;
    bool force = 2;
}

message GetRevisionsRequest {
    Kref item_kref = 1;
    // Optional pagination parameters
    optional PaginationRequest pagination = 2;
}

message GetRevisionsResponse {
    repeated RevisionResponse revisions = 1;
    // Pagination info for the response
    optional PaginationResponse pagination = 2;
}

// Batch revision fetching - fetch multiple revisions in a single call
message BatchGetRevisionsRequest {
    // List of revision krefs to fetch (e.g., kref://project/space/item.kind?r=1)
    repeated Kref revision_krefs = 1;
    // Or fetch by item krefs with optional tag (defaults to "latest")
    repeated Kref item_krefs = 2;
    // Tag to resolve when using item_krefs (default: "latest")
    string tag = 3;
    // If true, continue on not-found errors and return partial results
    bool allow_partial = 4;
}

message BatchGetRevisionsResponse {
    // Successfully fetched revisions (in same order as request when possible)
    repeated RevisionResponse revisions = 1;
    // Krefs that were not found (only populated if allow_partial=true)
    repeated string not_found = 2;
    // Total requested vs returned counts
    int32 requested_count = 3;
    int32 found_count = 4;
}

// Batch revision creation - write many revisions in a single call.
// The bulk-write RPC behind backfill, dream state, and migrations: N rows
// land in one transaction and one (chunked) embedding pass instead of N
// serial single-writes.
// An artifact to attach to a batch-created revision, completing the
// Item -> Revision -> Artifact chain in the same transaction.
message BatchArtifactInput {
    // Artifact name; must be kref-safe ([A-Za-z0-9._-]+) and unique within
    // the row. The artifact kref becomes "{revision_kref}&a={name}".
    string name = 1;
    // Storage location the artifact points at.
    string location = 2;
    map<string, string> metadata = 3;
    // Make this artifact the revision's default, so the location resolves
    // straight from an item kref (GetArtifact/ResolveLocation without an
    // artifact name). At most one artifact per row may set this.
    bool is_default = 4;
}

// One batch row: a revision to create plus any artifacts that go with it.
message BatchRevisionRow {
    // The revision to create. As with CreateRevision, `number` and
    // `exists_error` are ignored (numbers are server-assigned).
    CreateRevisionRequest revision = 1;
    // Artifacts to attach to the created revision. An invalid artifact spec
    // (bad name, duplicate name, >1 default) fails the whole row.
    repeated BatchArtifactInput artifacts = 2;
}

message BatchCreateRevisionsRequest {
    // Rows to write, in request order. As with CreateRevision, each row's
    // `number` and `exists_error` are ignored (revision numbers are always
    // server-assigned next-available).
    // Missing parent Items are auto-created from revision.item_kref (the
    // parent Space must exist, or the row fails). Rows targeting the same
    // item are applied in request order: consecutive numbers, SUPERSEDES
    // chained between them, and the last row carries the 'latest' tag.
    repeated BatchRevisionRow revisions = 1;

    // Optional idempotency prefix. When non-empty, each row is recorded under
    // the key "{prefix}:{row_index}" transactionally with the write, so
    // re-submitting the same batch returns the already-created revisions
    // instead of writing duplicates (replayed rows skip artifact creation
    // too). Empty = no idempotency.
    string idempotency_prefix = 2;
}

message BatchRevisionFailure {
    // Zero-based index of the failed row in the request.
    int32 index = 1;
    // Why the row was rejected (validation error, missing parent space, ...).
    string reason = 2;
}

message BatchCreateRevisionsResponse {
    // Positional, 1:1 with the request rows. Failed rows are empty stubs
    // (kref unset); consult `failures` for the reason.
    repeated RevisionResponse results = 1;
    // Rows rejected by per-row validation. All valid rows commit atomically:
    // any other failure fails the whole RPC with a gRPC error instead.
    repeated BatchRevisionFailure failures = 2;
    int32 requested_count = 3;
    // Rows that now have a revision (newly created or idempotent replay).
    int32 succeeded_count = 4;
}

// --- Artifact Messages ---

message CreateArtifactRequest {
    Kref revision_kref = 1;
    string name = 2;
    string location = 3;
    bool exists_error = 4;
    map<string, string> metadata = 5;
}

message ArtifactResponse {
    Kref kref = 1;
    string location = 2;
    Kref revision_kref = 3;
    Kref item_kref = 4;
    string created_at = 5;
    string modified_at = 6;
    string author = 7;
    map<string, string> metadata = 8;
    bool deprecated = 9;
    string username = 10;
    string name = 11;
}

message GetArtifactRequest {
    Kref revision_kref = 1;
    string name = 2;
}

message GetArtifactsRequest {
    Kref revision_kref = 1;
}

message GetArtifactsResponse {
    repeated ArtifactResponse artifacts = 1;
}

message DeleteArtifactRequest {
    Kref kref = 1;
    bool force = 2;
}

message GetArtifactsByLocationRequest {
    string location = 1;
}

message GetArtifactsByLocationResponse {
    repeated ArtifactResponse artifacts = 1;
}

// --- Tagging Messages ---

message TagRevisionRequest {
    Kref kref = 1;
    string tag = 2;
}

message UnTagRevisionRequest {
    Kref kref = 1;
    string tag = 2;
}

message HasTagRequest {
    Kref kref = 1;
    string tag = 2;
}

message HasTagResponse {
    bool has_tag = 1;
}

message WasTaggedRequest {
    Kref kref = 1;
    string tag = 2;
}

message WasTaggedResponse {
    bool was_tagged = 1;
}

// --- Default Artifact Messages ---

message SetDefaultArtifactRequest {
    Kref revision_kref = 1;
    string artifact_name = 2;
}


// --- Edge Messages ---

message CreateEdgeRequest {
    Kref source_revision_kref = 1;
    Kref target_revision_kref = 2;
    string edge_type = 3;
    map<string, string> metadata = 4;
    bool exists_error = 5;
}

// --- Metadata Update Messages ---
message UpdateMetadataRequest {
    Kref kref = 1;
    map<string, string> metadata = 2;
}

// Set a single metadata attribute (upsert)
message SetAttributeRequest {
    Kref kref = 1;
    string key = 2;
    string value = 3;
}

// Get a single metadata attribute
message GetAttributeRequest {
    Kref kref = 1;
    string key = 2;
}

message GetAttributeResponse {
    string key = 1;
    string value = 2;
    bool exists = 3;
}

// Delete a single metadata attribute
message DeleteAttributeRequest {
    Kref kref = 1;
    string key = 2;
}

// --- Peek Next Revision Messages ---
message PeekNextRevisionRequest {
    Kref item_kref = 1;
}

message PeekNextRevisionResponse {
    int32 number = 1;
}

enum EdgeDirection {
    OUTGOING = 0;
    INCOMING = 1;
    BOTH = 2;
}

message GetEdgesRequest {
    Kref kref = 1; // The revision to get edges for.
    string edge_type_filter = 2; // Optional: if empty, returns all edges.
    EdgeDirection direction = 3; // Optional: defaults to OUTGOING
    // Optional pagination parameters
    optional PaginationRequest pagination = 4;
}

message GetEdgesResponse {
    repeated Edge edges = 1;
    repeated Kref revision_krefs = 2;
    // Pagination info for the response
    optional PaginationResponse pagination = 3;
}

message DeleteEdgeRequest {
    Kref source_kref = 1;
    Kref target_kref = 2;
    string edge_type = 3;
}

// --- Graph Traversal Messages ---

// Represents a single step in a traversal path
message PathStep {
    Kref revision_kref = 1;
    string edge_type = 2;      // The relationship type used to reach this node
    int32 depth = 3;           // Distance from the origin (0 = origin)
}

// Represents a complete path between two revisions
message RevisionPath {
    repeated PathStep steps = 1;
    int32 total_depth = 2;
}

// Request for transitive dependency/dependents traversal
message TraverseEdgesRequest {
    Kref origin_kref = 1;                    // Starting revision
    EdgeDirection direction = 2;              // OUTGOING = dependencies, INCOMING = dependents
    repeated string edge_type_filter = 3;     // Filter by edge types (empty = all)
    int32 max_depth = 4;                      // Maximum traversal depth (0 = default of 10)
    int32 limit = 5;                          // Max results to return (default 100)
    bool include_path = 6;                    // Whether to include full path info
}

message TraverseEdgesResponse {
    repeated RevisionPath paths = 1;           // If include_path=true
    repeated Kref revision_krefs = 2;          // Flat list of discovered revisions
    repeated Edge edges = 3;                   // All traversed edges
    int32 total_count = 4;                    // Total nodes found
    bool truncated = 5;                       // True if results were limited
}

// Request for shortest path between two revisions
message ShortestPathRequest {
    Kref source_kref = 1;
    Kref target_kref = 2;
    repeated string edge_type_filter = 3;     // Filter by edge types (empty = all)
    int32 max_depth = 4;                      // Maximum path length to search (default: 10)
    bool all_shortest = 5;                    // Return all shortest paths, not just one
}

message ShortestPathResponse {
    repeated RevisionPath paths = 1;           // One or more shortest paths
    bool path_exists = 2;                     // True if any path was found
    int32 path_length = 3;                    // Length of shortest path(s)
}

// Request for impact analysis (what depends on this revision, transitively)
message ImpactAnalysisRequest {
    Kref revision_kref = 1;
    repeated string edge_type_filter = 2;     // Usually ["DEPENDS_ON"]
    int32 max_depth = 3;                      // Default: 10
    int32 limit = 4;                          // Max results
}

message ImpactedRevision {
    Kref revision_kref = 1;
    Kref item_kref = 2;
    int32 impact_depth = 3;                   // How many hops away
    repeated string impact_path_types = 4;    // Edge types in the impact chain
}

message ImpactAnalysisResponse {
    repeated ImpactedRevision impacted_revisions = 1;
    int32 total_impacted = 2;
    bool truncated = 3;
}

// --- Bundle Messages ---
// Bundles are special items that aggregate other items.
// The "bundle" kind is reserved and cannot be created manually.

message CreateBundleRequest {
    string parent_path = 1;          // Space path where bundle will be created
    string bundle_name = 2;           // Name of the bundle
    map<string, string> metadata = 3; // Initial metadata
}

message BundleMember {
    Kref item_kref = 1;               // The item that is a member
    string added_at = 2;              // When the item was added to bundle
    string added_by = 3;              // Who added the item (author uuid)
    string added_by_username = 4;     // Username who added the item
    int32 added_in_revision = 5;      // Which bundle revision this was added
}

message AddBundleMemberRequest {
    Kref bundle_kref = 1;             // The bundle item kref
    Kref member_item_kref = 2;        // The item to add as member
    map<string, string> metadata = 3; // Optional metadata for revision tracking
}

message AddBundleMemberResponse {
    bool success = 1;
    string message = 2;
    RevisionResponse new_revision = 3;  // The new revision created for this change
}

message RemoveBundleMemberRequest {
    Kref bundle_kref = 1;             // The bundle item kref
    Kref member_item_kref = 2;        // The item to remove
    map<string, string> metadata = 3; // Optional metadata for revision tracking
}

message RemoveBundleMemberResponse {
    bool success = 1;
    string message = 2;
    RevisionResponse new_revision = 3;  // The new revision created for this change
}

message GetBundleMembersRequest {
    Kref bundle_kref = 1;             // The bundle item kref
    optional int32 revision_number = 2; // Optional: specific revision (default: latest)
}

message GetBundleMembersResponse {
    repeated BundleMember members = 1;
    int32 revision_number = 2;         // Which revision's membership this represents
    int32 total_count = 3;
}

message BundleRevisionHistory {
    int32 revision_number = 1;
    string action = 2;                // "ADDED" or "REMOVED"
    Kref member_item_kref = 3;        // The item that was added/removed
    string author = 4;
    string username = 5;
    string created_at = 6;
    map<string, string> metadata = 7; // Immutable audit metadata
}

message GetBundleHistoryRequest {
    Kref bundle_kref = 1;
}

message GetBundleHistoryResponse {
    repeated BundleRevisionHistory history = 1;
}

// --- Event Streaming Messages ---

message EventStreamRequest {
    // A routing key filter, e.g., "item.model.created" or "revision.tagged.*"
    // An empty string subscribes to all events.
    string routing_key_filter = 1;
    // A kref filter for filtering by object URI patterns, e.g., "kref://projectA/**/*.model"
    // Supports wildcards. An empty string means no kref filtering.
    string kref_filter = 2;
    
    // Cursor-based resume (Creator tier and above)
    // Resume from a previous event cursor to avoid missing events during disconnection.
    optional string cursor = 3;
    
    // Consumer group for load-balanced delivery (Enterprise tier only)
    // Multiple consumers in the same group will each receive different events.
    optional string consumer_group = 4;
    
    // Start position options (Creator tier and above)
    oneof start_position {
        bool from_latest = 5;       // Default: only new events from now
        string from_cursor = 6;     // Resume from cursor (same as cursor field, for explicit choice)
        string from_timestamp = 7;  // Replay from ISO timestamp
        bool from_beginning = 8;    // All available history (subject to retention)
    }
}

message Event {
    // A routing key describing the event, e.g., "item.model.created"
    string routing_key = 1;
    // The Kref of the object that was affected.
    Kref kref = 2;
    // Timestamp of the event.
    string timestamp = 3;
    // The user who triggered the event.
    string author = 4;
    // Tenant scope for isolation in shared deployments.
    string tenant_id = 5;
    // Additional details about the event, e.g., the tag that was added.
    map<string, string> details = 6;
    string username = 7;
    
    // Cursor for resumable streaming (Creator tier and above).
    // Save this cursor and pass it in EventStreamRequest.cursor to resume
    // from this point after reconnection.
    string cursor = 8;
}

// Request for event streaming capabilities
message GetEventCapabilitiesRequest {
    // Empty - capabilities are determined by authenticated tenant's tier
}

// Event streaming capabilities for the current tenant tier
message EventCapabilities {
    // Whether this tier supports replaying past events
    bool supports_replay = 1;
    // Whether cursor-based resume is supported
    bool supports_cursor = 2;
    // Whether consumer groups are supported (Enterprise only)
    bool supports_consumer_groups = 3;
    // Maximum event retention in hours (0 = none, -1 = unlimited)
    int64 max_retention_hours = 4;
    // Maximum events in buffer (0 = none, -1 = unlimited)
    int64 max_buffer_size = 5;
    // Tier identifier (free, creator, studio, enterprise)
    string tier = 6;
}

// --- Project Messages (gRPC parity with HTTP) ---

message CreateProjectRequest {
    string name = 1;
    string description = 2;
    map<string, string> metadata = 3;
}

message ProjectResponse {
    string project_id = 1;
    string name = 2;
    string description = 3;
    string created_at = 4;
    string updated_at = 5;
    bool deprecated = 6;
    bool allow_public = 7;
    map<string, string> metadata = 8;
}

message GetProjectsRequest {
    bool include_deprecated = 1;
}

message GetProjectsResponse {
    repeated ProjectResponse projects = 1;
}

message DeleteProjectRequest {
    string project_id = 1;
    // Legacy contract: owner/admin force=true performs immediate permanent
    // deletion; other calls archive the Project.
    bool force = 2;
    reserved 3, 4, 5;
    reserved "impact_snapshot_id", "impact_snapshot_hash", "confirmed";
}

// Snapshot-bound permanent deletion. New clients should prefer this API over
// DeleteProject(force=true); the legacy operation remains for compatibility.
message HardDeleteProjectRequest {
    string project_id = 1;
    string impact_snapshot_id = 2;
    string impact_snapshot_hash = 3;
    bool confirmed = 4;
}

message ProjectDeletionImpactRequest {
    string project_id = 1;
}

message ProjectDeletionImpactResponse {
    string impact_snapshot_id = 1;
    string impact_snapshot_hash = 2;
    string project_id = 3;
    string project_name = 4;
    repeated string blockers = 5;
    repeated string descendants = 6;
    string created_at = 7;
}

// Opaque application-owned deletion guard. Kumiho stores and enforces the
// guard without interpreting application kinds, statuses, or metadata values.
message RegisterProjectDeletionGuardRequest {
    string project_id = 1;
    string guard_id = 2;
    string resource_kref = 3;
    repeated string allowed_operations = 4;
    repeated string allowed_metadata_keys = 5;
}

message ResolveProjectDeletionGuardRequest {
    string project_id = 1;
    string guard_id = 2;
}

message ProjectDeletionGuardResponse {
    string project_id = 1;
    string guard_id = 2;
    string resource_kref = 3;
    repeated string allowed_operations = 4;
    repeated string allowed_metadata_keys = 5;
    string created_at = 6;
}

// Move an Item between tenant-owned Spaces while preserving its immutable kref.
// This is a graph ownership operation; application-specific metadata is not
// interpreted by Kumiho.
message MoveItemRequest {
    string item_kref = 1;
    string target_space_path = 2;
}

// Resolve one registered cross-Project Revision reference on an archived
// Project. The server validates the current edge and owns the mutation.
message ResolveProjectReferenceRequest {
    string project_id = 1;
    string inside_revision_kref = 2;
    string outside_revision_kref = 3;
    string edge_type = 4;
    // "detach" or "replace".
    string action = 5;
    string replacement_revision_kref = 6;
}


message UpdateProjectRequest {
    string project_id = 1;
    optional bool allow_public = 2;
    optional string description = 3;
    // Non-empty metadata merges the supplied keys into Project metadata.
    map<string, string> metadata = 4;
    optional bool deprecated = 5;
}

// The Kumiho service definition.
service KumihoService {
    // Project methods
    rpc CreateProject(CreateProjectRequest) returns (ProjectResponse);
    rpc GetProjects(GetProjectsRequest) returns (GetProjectsResponse);
    rpc UpdateProject(UpdateProjectRequest) returns (ProjectResponse);
    rpc AnalyzeProjectDeletion(ProjectDeletionImpactRequest) returns (ProjectDeletionImpactResponse);
    rpc RegisterProjectDeletionGuard(RegisterProjectDeletionGuardRequest) returns (ProjectDeletionGuardResponse);
    rpc ResolveProjectDeletionGuard(ResolveProjectDeletionGuardRequest) returns (StatusResponse);
    rpc ResolveProjectReference(ResolveProjectReferenceRequest) returns (StatusResponse);
    rpc DeleteProject(DeleteProjectRequest) returns (StatusResponse);
    rpc HardDeleteProject(HardDeleteProjectRequest) returns (StatusResponse);

    // Space methods
    rpc CreateSpace(CreateSpaceRequest) returns (SpaceResponse);
    rpc GetSpace(GetSpaceRequest) returns (SpaceResponse);
    rpc GetChildSpaces(GetChildSpacesRequest) returns (GetChildSpacesResponse);
    rpc DeleteSpace(DeleteSpaceRequest) returns (StatusResponse);
    rpc UpdateSpaceMetadata(UpdateMetadataRequest) returns (SpaceResponse);

    // Item methods
    rpc CreateItem(CreateItemRequest) returns (ItemResponse);
    rpc GetItem(GetItemRequest) returns (ItemResponse);
    rpc GetItems(GetItemsRequest) returns (GetItemsResponse);
    rpc ItemSearch(ItemSearchRequest) returns (GetItemsResponse);
    rpc DeleteItem(DeleteItemRequest) returns (StatusResponse);
    rpc UpdateItemMetadata(UpdateMetadataRequest) returns (ItemResponse);
    rpc MoveItem(MoveItemRequest) returns (ItemResponse);

    // Full-text search (Google-like fuzzy search across items)
    rpc Search(SearchRequest) returns (SearchResponse);

    // Score specific revisions against a query (server-side embeddings + fulltext)
    rpc ScoreRevisions(ScoreRevisionsRequest) returns (ScoreRevisionsResponse);

    // Revision methods
    rpc ResolveKref(ResolveKrefRequest) returns (RevisionResponse);
    rpc ResolveLocation(ResolveLocationRequest) returns (ResolveLocationResponse);
    rpc CreateRevision(CreateRevisionRequest) returns (RevisionResponse);
    rpc GetRevision(KrefRequest) returns (RevisionResponse);
    rpc GetRevisions(GetRevisionsRequest) returns (GetRevisionsResponse);
    rpc BatchGetRevisions(BatchGetRevisionsRequest) returns (BatchGetRevisionsResponse);
    rpc BatchCreateRevisions(BatchCreateRevisionsRequest) returns (BatchCreateRevisionsResponse);
    rpc DeleteRevision(DeleteRevisionRequest) returns (StatusResponse);
    rpc PeekNextRevision(PeekNextRevisionRequest) returns (PeekNextRevisionResponse);
    rpc UpdateRevisionMetadata(UpdateMetadataRequest) returns (RevisionResponse);
    rpc TagRevision(TagRevisionRequest) returns (StatusResponse);
    rpc UnTagRevision(UnTagRevisionRequest) returns (StatusResponse);
    rpc HasTag(HasTagRequest) returns (HasTagResponse);
    rpc WasTagged(WasTaggedRequest) returns (WasTaggedResponse);
    rpc SetDefaultArtifact(SetDefaultArtifactRequest) returns (StatusResponse);

    // Artifact methods
    rpc CreateArtifact(CreateArtifactRequest) returns (ArtifactResponse);
    rpc GetArtifact(GetArtifactRequest) returns (ArtifactResponse);
    rpc GetArtifacts(GetArtifactsRequest) returns (GetArtifactsResponse);
    rpc GetArtifactsByLocation(GetArtifactsByLocationRequest) returns (GetArtifactsByLocationResponse);
    rpc DeleteArtifact(DeleteArtifactRequest) returns (StatusResponse);
    rpc UpdateArtifactMetadata(UpdateMetadataRequest) returns (ArtifactResponse);

    // Attribute methods (granular metadata operations)
    // These work on any entity type (Revision, Item, Artifact, Space) identified by kref
    rpc SetAttribute(SetAttributeRequest) returns (StatusResponse);
    rpc GetAttribute(GetAttributeRequest) returns (GetAttributeResponse);
    rpc DeleteAttribute(DeleteAttributeRequest) returns (StatusResponse);

    // Edge methods
    rpc CreateEdge(CreateEdgeRequest) returns (StatusResponse);
    rpc GetEdges(GetEdgesRequest) returns (GetEdgesResponse);
    rpc DeleteEdge(DeleteEdgeRequest) returns (StatusResponse);

    // Graph Traversal methods
    rpc TraverseEdges(TraverseEdgesRequest) returns (TraverseEdgesResponse);
    rpc FindShortestPath(ShortestPathRequest) returns (ShortestPathResponse);
    rpc AnalyzeImpact(ImpactAnalysisRequest) returns (ImpactAnalysisResponse);

    // Bundle methods
    rpc CreateBundle(CreateBundleRequest) returns (ItemResponse);
    rpc AddBundleMember(AddBundleMemberRequest) returns (AddBundleMemberResponse);
    rpc RemoveBundleMember(RemoveBundleMemberRequest) returns (RemoveBundleMemberResponse);
    rpc GetBundleMembers(GetBundleMembersRequest) returns (GetBundleMembersResponse);
    rpc GetBundleHistory(GetBundleHistoryRequest) returns (GetBundleHistoryResponse);

    // Tenant methods
    rpc GetTenantUsage(GetTenantUsageRequest) returns (TenantUsageResponse);

    // Event Streaming
    rpc EventStream(EventStreamRequest) returns (stream Event);
    
    // Get event streaming capabilities for the authenticated tenant's tier
    rpc GetEventCapabilities(GetEventCapabilitiesRequest) returns (EventCapabilities);

    // Deprecation methods
    rpc SetDeprecated(SetDeprecatedRequest) returns (StatusResponse);

    // --- Evaluation (Kumiho Cloud, paid tiers only) -----------------------
    // Judge prepared fragments against caller-supplied questions using a
    // server-managed evaluation provider. Not available in self-hosted CE.
    rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
}

message SetDeprecatedRequest {
    Kref kref = 1;
    bool deprecated = 2;
}

message GetTenantUsageRequest {
    // Empty request, context is derived from auth token
}

message TenantUsageResponse {
    int64 node_count = 1;
    int64 node_limit = 2;
    string tenant_id = 3;
}

// ---------------------------------------------------------------------------
// Evaluation (Kumiho Cloud, paid tiers only)
//
// `Evaluate` is a pure function of its request plus metering/cache state. It
// never reads, writes, tags or otherwise touches the graph. Krefs and tenant
// identifiers never leave the server: the caller supplies opaque fragment ids
// and the text to judge.
//
// Wire shape sent to the evaluation provider (identical in both modes):
//
//   state = {
//     "query":   <task.query>,
//     "context": <task.extra_context>,          // omitted when empty
//     "fragments": {
//       "F01": {"text": <fragment.text>, ...fragment.metadata entries...},
//       "F02": {...}
//     }
//   }
//
// The server assigns the labels `F01`, `F02`, ... in request order and keeps
// the label -> fragment_id map private. Caller fragment ids are never sent to
// the provider.
// ---------------------------------------------------------------------------

enum EvaluationMode {
    // Server picks. Currently BATCHED: judging the fragments together ranks
    // the relevant ones better than one request per fragment, costs fewer
    // tokens, and needs a handful of provider requests per call instead of
    // one per fragment.
    EVALUATION_MODE_UNSPECIFIED = 0;
    // One provider request per fragment. Costs the question/criteria tokens
    // once per fragment and burns one request from the provider's account-wide
    // rate budget per fragment.
    EVALUATION_MODE_PER_FRAGMENT = 1;
    // Fragments are packed into as few provider requests as the provider's
    // token limits allow, in request order (see `EvaluateResponse.usage`).
    EVALUATION_MODE_BATCHED = 2;
}

enum QuestionType {
    QUESTION_TYPE_UNSPECIFIED = 0;
    QUESTION_TYPE_NOUL = 1;    // -> float in [0,1]
    QUESTION_TYPE_CHOICE = 2;  // -> chosen option + per-option probabilities
    QUESTION_TYPE_SCORE = 3;   // -> numeric level + legend
}

message EvaluationTaskContext {
    // What the caller is trying to answer/do. Sent to the provider verbatim.
    string query = 1;
    // Optional extra framing (constraints, current date, workspace hints).
    // Omitted from the provider request when empty.
    string extra_context = 2;
}

message EvaluationFragment {
    // Caller-scoped id, unique within this request. Echoed back on every
    // answer. Never sent to the provider, which sees only the server-assigned
    // label. Must NOT be a kref: krefs and tenant identifiers never leave the
    // server.
    string fragment_id = 1;
    // The text to judge.
    string text = 2;
    // Optional non-identifying hints (e.g. {"origin":"user"}). Merged into the
    // fragment object sent to the provider alongside `text`; keep it small, it
    // is billed as input tokens.
    map<string, string> metadata = 3;
}

message EvaluationQuestion {
    // Unique within the request, non-empty. Must not contain `__`, which the
    // server uses to build per-fragment provider question ids.
    string question_id = 1;
    QuestionType type = 2;
    // Natural-language instructions. Billed on every provider request.
    //
    // `instructions` and the `criteria` texts may contain the literal
    // placeholder `{fragment}`. The server then renders one provider question
    // per (question, fragment) with `{fragment}` replaced by that fragment's
    // label, e.g. "Does memory {fragment} address the subject of the query?"
    // becomes "Does memory F07 address the subject of the query?".
    //
    // A question with no `{fragment}` placeholder is asked once per provider
    // request and its answer is attached to every fragment in that request.
    string instructions = 3;
    // NOUL:   optional; keys "true" / "false".
    // CHOICE: required; option -> description (description may be empty).
    //         At most 255 options.
    // SCORE:  ignored; use `criteria_levels` instead.
    map<string, string> criteria = 4;
    // SCORE only: >= 2 ordered level descriptions.
    repeated string criteria_levels = 5;
}

message EvaluateRequest {
    EvaluationTaskContext task = 1;
    // At most 64 per call. Ids must be non-empty and unique.
    repeated EvaluationFragment fragments = 2;
    // At most 8 per call.
    repeated EvaluationQuestion questions = 3;
    EvaluationMode mode = 4;
    // Opaque caller-owned version string, folded into the cache key and echoed
    // back. Enables reproducibility and rollback.
    string rubric_version = 5;
    // Caller's overall deadline hint. The server clamps to its own maximum.
    uint32 timeout_ms = 6;
    // When true (the default) the server may serve a cached response. When
    // false the read is bypassed but the fresh response is still cached.
    optional bool allow_cache = 7;
}

enum EvaluationStatus {
    EVALUATION_STATUS_UNSPECIFIED = 0;
    EVALUATION_STATUS_OK = 1;
    EVALUATION_STATUS_PARTIAL = 2;              // some fragments answered, some not
    EVALUATION_STATUS_OVER_LIMIT = 3;           // monthly input-token budget exhausted
    EVALUATION_STATUS_NOT_ENTITLED = 4;         // evaluation not enabled for this tenant
    EVALUATION_STATUS_PROVIDER_UNAVAILABLE = 5; // timeout / breaker open / 5xx / meter down
    EVALUATION_STATUS_INVALID_REQUEST = 6;      // shape violation, or a single fragment too large
}

message NoulAnswer {
    float noul = 1;
}

message ChoiceAnswer {
    string choice = 1;
    map<string, float> probabilities = 2;
    float confidence = 3;
}

message ScoreAnswer {
    float score = 1;
    repeated string legend = 2;
    repeated float probabilities = 3;
    float confidence = 4;
}

message EvaluationAnswer {
    // The caller's `question_id`, not the server's internal per-fragment id.
    string question_id = 1;
    oneof value {
        NoulAnswer noul = 2;
        ChoiceAnswer choice = 3;
        ScoreAnswer score = 4;
    }
}

message FragmentEvaluation {
    string fragment_id = 1;
    repeated EvaluationAnswer answers = 2;
    // Per-fragment failure (e.g. the provider request carrying this fragment
    // failed). Empty when the fragment was answered. Never contains provider
    // keys or provider response bodies.
    string error = 3;
}

message EvaluationUsage {
    int64 input_tokens = 1;       // provider-reported, billable; 0 on a cache hit
    int64 output_tokens = 2;      // provider-reported
    int32 provider_requests = 3;  // chunks actually sent
    int32 cached_fragments = 4;   // fragments served from cache (not metered)
    int64 month_tokens_used = 5;  // after this request
    int64 month_tokens_limit = 6; // -1 = unlimited
}

message EvaluateResponse {
    EvaluationStatus status = 1;
    // One entry per request fragment, in request order.
    repeated FragmentEvaluation fragments = 2;
    EvaluationUsage usage = 3;
    // The provider's resolved, versioned model id, not the requested
    // alias. Empty on a request that never reached the provider.
    string model_id = 4;
    string rubric_version = 5;
    // Human-readable detail for non-OK statuses. Never contains provider keys,
    // provider response bodies or fragment text.
    string message = 6;
}
